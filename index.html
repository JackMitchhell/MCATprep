<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCAT &amp; Med School Prep Tracker</title>
  <meta name="description" content="Periodized, day-to-day MCAT study tracker with spaced repetition, daily targets, curated free resources, and a med-school application checklist." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">🧬</span>
        <div class="brand-text">
          <strong>MCAT Prep</strong>
          <small>Med School Track</small>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico">📊</span> Dashboard</a>
        <a href="#/today" data-route="today"><span class="ico">🎯</span> Today</a>
        <a href="#/plan" data-route="plan"><span class="ico">🗓️</span> Study Plan</a>
        <a href="#/flashcards" data-route="flashcards"><span class="ico">🔁</span> Flashcards</a>
        <a href="#/cars" data-route="cars"><span class="ico">⏱️</span> CARS Timer</a>
        <a href="#/journal" data-route="journal"><span class="ico">📓</span> Journal</a>
        <a href="#/resources" data-route="resources"><span class="ico">📚</span> Resources</a>
        <a href="#/application" data-route="application"><span class="ico">🏥</span> Application</a>
        <a href="#/settings" data-route="settings"><span class="ico">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="streak-pill" id="streakPill">🔥 <span id="streakCount">0</span> day streak</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-right">
          <div class="countdown-mini" id="countdownMini"></div>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/data/curriculum.js"></script>
  <script src="assets/js/data/flashcards.js"></script>
  <script src="assets/js/data/checklist.js"></script>
  <script src="assets/js/srs.js"></script>
  <script src="assets/js/planner.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
